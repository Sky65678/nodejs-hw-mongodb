tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create contact'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: 'Contact name'
            type: string
            example: 'John Doe'
          phoneNumber:
            description: 'Contact phone number'
            type: string
            example: '38068000987'
          email:
            description: 'Contact email'
            type: string
            example: test@gmail.com
          isFavourite:
            description: 'Contact is favourite'
            type: boolean
            example: true
            default: false
          contactType:
            description: 'Contact choose type'
            type: string
            enum: ['work', 'home', 'personal']
            example: work
            default: personal
          userId:
            description: "Contact's parent id"
            type: string
            example: 65e4decdd286b30065d54af9
            readOnly: true
          photo:
            description: "Link to contact's photo"
            format: binary
            type: string
            example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
responses:
  '201':
    description: Contact created
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created contact!
            data:
              $ref: '../../components/schemas/contact.yaml'
  '400':
    $ref: '../../components/responses/400.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
